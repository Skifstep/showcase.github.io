<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калономикон — витрина</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='0.9em' font-size='56'%3E%F0%9F%92%80%3C/text%3E%3C/svg%3E">
  <style>
    :root{--bg:#101426;--panel:#19213b;--panel2:#222c4c;--text:#f5f7ff;--muted:#aab4d0;--red:#e94560;--green:#64d88b;--gold:#ffcc66;--blue:#64b5f6}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 15% 0%,#2b1d43,var(--bg) 44%);font:15px/1.45 Segoe UI,Tahoma,sans-serif}.shell{width:min(1160px,calc(100% - 28px));margin:auto;padding:28px 0 55px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:18px}.logo{width:min(340px,58vw);max-height:105px;object-fit:contain;filter:invert(1) drop-shadow(0 4px 6px #0008)}.subtitle{color:var(--muted);margin:5px 0 0}.cat{width:90px;cursor:pointer;user-select:none;filter:drop-shadow(0 4px 6px #0008);transition:transform .2s}.cat.shaking{animation:catShake .3s ease-in-out}@keyframes catShake{0%,100%{transform:translateX(0) rotate(0)}25%,75%{transform:translateX(-5px) rotate(-5deg)}50%{transform:translateX(5px) rotate(5deg)}}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}button,.file{border:1px solid #46537d;border-radius:9px;padding:10px 13px;background:var(--panel2);color:var(--text);cursor:pointer;font-weight:600}button:hover,.file:hover{border-color:var(--red);background:#2c385e}.file input{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.stat,.panel{background:linear-gradient(150deg,#222c4cf5,#161d36f5);border:1px solid #354265;border-radius:14px;box-shadow:0 12px 35px #05071366}.stat{padding:14px}.stat strong{display:block;font-size:27px}.stat span{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}input,select,textarea{border:1px solid #46537d;border-radius:9px;padding:10px 12px;color:var(--text);background:#11182d;outline:none}#search{flex:1;min-width:220px}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button.active{background:var(--red);border-color:var(--red)}.panel{padding:18px}.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:13px}.head small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:11px}.card{padding:15px;border:1px solid #39476e;border-radius:11px;background:#151d35;min-height:135px}.card.expired{opacity:.68}.card h3{margin:0;font-size:17px}.card p{color:#d9def0;margin:8px 0 12px}.badge{display:inline-block;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:800;letter-spacing:.4px}.active{color:#08190f;background:var(--green)}.expired-badge{color:#fff;background:#626a80}.punished{color:#fff;background:linear-gradient(145deg,#b40000,#5a0000);box-shadow:inset 0 1px 1px #fff4,0 2px 5px #0009}.timer{color:var(--gold);font-weight:700;font-size:13px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #303d61}th{color:var(--muted);font-size:12px;text-transform:uppercase}tr:last-child td{border:0}.fate{font-weight:700}.fate .badge{margin-left:12px}.holiday{color:var(--blue)}.wildcard{color:#79e39b}.empty{text-align:center;color:var(--muted);padding:28px}.notice{color:var(--muted);font-size:13px;margin-top:14px}@media(max-width:680px){header{align-items:flex-start;flex-direction:column}.brand{width:100%;justify-content:space-between}.stats{grid-template-columns:repeat(2,1fr)}.cat{width:70px}}
    .free-target{color:#fff;background:linear-gradient(145deg,#36c979,#137343);box-shadow:inset 0 1px 1px #fff4,0 2px 5px #0006}
</style>
<style>button,.file{background:#202b49;border-color:#526184}button:hover,.file:hover{background:#293759;border-color:#6c7da5}.free-target{color:#fff;background:#287b58}</style></head>
<body>
  <main class="shell">
    <header><div class="brand"><div><img class="logo" src="calonomicon.png" alt="Калономикон"><p class="subtitle">Публичный реестр проклятий и доска дружбы</p></div><div id="cat" class="cat" title="Погладить котика"><img class="cat" src="coolcat.png" alt="Кот Калономикона"></div></div><div class="actions"><button id="refresh">Обновить</button><label class="file">Импорт JSON <input id="import" type="file" accept=".json,application/json"></label></div></header>
    <section class="stats"><div class="stat"><strong id="all">0</strong><span>всего проклятий</span></div><div class="stat"><strong id="active-count">0</strong><span>активных</span></div><div class="stat"><strong id="expired-count">0</strong><span>завершённых</span></div><div class="stat"><strong id="board-count-stat">0</strong><span>записей на доске</span></div></section>
    <div class="toolbar"><input id="search" type="search" placeholder="Поиск по имени, тексту или празднику…"><select id="status"><option value="all">Все проклятия</option><option value="active">Только активные</option><option value="expired">Только завершённые</option></select></div>
    <nav class="tabs"><button class="active" data-tab="curses">Реестр проклятий</button><button data-tab="board">Доска дружбы</button></nav>
    <section id="curses-view" class="panel"><div class="head"><h2>Реестр проклятий</h2><small id="curses-count"></small></div><div id="cards" class="grid"></div></section>
    <section id="board-view" class="panel" hidden><div class="head"><h2>Доска дружбы</h2><small id="board-count"></small></div><div class="table-wrap"><table><thead><tr><th>Дата</th><th>Праздник</th><th>Результат</th><th>Тип</th></tr></thead><tbody id="board"></tbody></table></div></section>
    <p class="notice">Данные загружаются импортом JSON или из адреса <code>DATA_URL</code> в скрипте. Не публикуйте email и другие приватные поля.</p>
  </main>
  <script>
    const DATA_URL='';
    const state={curses:[],board:[],tab:localStorage.getItem('showcase_tab')||'curses'};const STORAGE_KEY='calonomicon_showcase_data';
    const $=id=>document.getElementById(id);
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[c]));
    const time=v=>{const n=new Date(v).getTime();return Number.isFinite(n)?n:0};
    const left=end=>{const d=Number(end)-Date.now();if(d<=0)return'Срок истёк';const m=Math.floor(d/60000),days=Math.floor(m/1440),hours=Math.floor((m%1440)/60);return days?`${days} дн. ${hours} ч.`:hours?`${hours} ч. ${m%60} мин.`:`${m} мин.`};
    function load(data){state.curses=Array.isArray(data)?data:(data.curses||data.activeCurses||[]);state.board=Array.isArray(data)?[]:(data.friendshipBoard||data.board||[]);localStorage.setItem(STORAGE_KEY,JSON.stringify({curses:state.curses,board:state.board}));render()}
    function loadSaved(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(saved){load(saved);return true}const curses=JSON.parse(localStorage.getItem('activeCurses')||'[]'),board=JSON.parse(localStorage.getItem('calonomicon_friendship_board')||'[]');if(curses.length||board.length){load({curses,board});return true}}catch(e){}return false}
    function render(){const q=$('search').value.trim().toLowerCase(),filter=$('status').value,now=Date.now();const curses=state.curses.filter(x=>{const active=Number(x.endTime)>now,text=`${x.name||''} ${x.text||''} ${x.holiday||''}`.toLowerCase();return(!q||text.includes(q))&&(filter==='all'||filter===(active?'active':'expired'))}).sort((a,b)=>time(b.endTime)-time(a.endTime));$('cards').innerHTML=curses.length?curses.map(x=>{const on=Number(x.endTime)>now;return`<article class="card ${on?'':'expired'}"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(x.emoji||'💀')} ${esc(x.name||'Без имени')}</h3><span class="badge ${on?'active':'expired-badge'}">${on?'АКТИВНО':'ЗАВЕРШЕНО'}</span></div><p>${esc(x.text||'Без текста')}</p><div class="timer">${on?'Осталось: '+left(x.endTime):'✔ Срок истёк'}</div></article>`}).join(''):'<div class="empty">Записей нет.</div>';$('curses-count').textContent=`${curses.length} из ${state.curses.length}`;const board=[...state.board].sort((a,b)=>time(b.date)-time(a.date));$('board').innerHTML=board.length?board.map(x=>`<tr><td>${esc(x.date||'—')}</td><td class="${x.isHoliday?'holiday':''}">${esc(x.holiday||'—')}</td><td class="fate ${x.isWildcard?'wildcard':''}">${esc(x.emoji||(x.isWildcard?'🌟':'💀'))} ${esc(x.text||'—')}${x.isPunished?' <span class="badge punished">НАКАЗАН</span>':''}${x.freeTargetName?' <span class="badge free-target">🎯 '+esc(x.freeTargetName)+'</span>':''}</td><td>${x.isHoliday?'Праздник':x.isWildcard?'Вайлдкард':'Обычный результат'}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Доска пока пуста.</td></tr>';$('board-count').textContent=`${state.board.length} записей`;$('all').textContent=state.curses.length;$('active-count').textContent=state.curses.filter(x=>Number(x.endTime)>now).length;$('expired-count').textContent=state.curses.filter(x=>!(Number(x.endTime)>now)).length;$('board-count-stat').textContent=state.board.length;$('curses-view').hidden=state.tab!=='curses';$('board-view').hidden=state.tab!=='board';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab))}
    async function remote(){if(!DATA_URL)return;try{const r=await fetch(DATA_URL,{cache:'no-store'});if(!r.ok)throw Error(r.status);load(await r.json())}catch(e){console.warn('Не удалось загрузить DATA_URL',e)}}
    document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});$('search').oninput=render;$('status').onchange=render;$('refresh').onclick=remote;$('import').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{load(JSON.parse(r.result))}catch{alert('Некорректный JSON')}};r.readAsText(f);e.target.value=''};
    let catAudioContext=null;
    function playMeow(){
      try{
        if(!catAudioContext) catAudioContext=new(window.AudioContext||window.webkitAudioContext)();
        if(catAudioContext.state==='suspended') catAudioContext.resume();
        const oscillator=catAudioContext.createOscillator(),gain=catAudioContext.createGain(),now=catAudioContext.currentTime;
        oscillator.connect(gain);gain.connect(catAudioContext.destination);oscillator.type='sawtooth';
        oscillator.frequency.setValueAtTime(600,now);oscillator.frequency.exponentialRampToValueAtTime(1000,now+.1);oscillator.frequency.exponentialRampToValueAtTime(700,now+.35);
        gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(.1,now+.05);gain.gain.linearRampToValueAtTime(.1,now+.15);gain.gain.linearRampToValueAtTime(0,now+.35);
        oscillator.start(now);oscillator.stop(now+.35);
      }catch{}
    }
    const cat=$('cat'),catImage=cat.querySelector('img');let mirrored=false;cat.onclick=()=>{cat.classList.remove('shaking');void cat.offsetWidth;cat.classList.add('shaking');mirrored=!mirrored;catImage.style.transform=mirrored?'scaleX(-1)':'scaleX(1)';playMeow();setTimeout(()=>cat.classList.remove('shaking'),350)};
    // Первый рендер выполняется ниже, после установки корректной обработки
    // разовых проклятий. Это исключает кратковременный статус «Выполнено».
    loadSaved();remote();setInterval(render,30000);
    // Одноразовые проклятия не имеют срока окончания: на витрине они
    // должны отображаться как действующие с отдельной пометкой.
    const originalShowcaseRender = render;
    render = function(){
      const oneTimeEnds=state.curses.filter(x=>x.oneTime===true||x.oneTime==='true').map(x=>[x,x.endTime]);
      oneTimeEnds.forEach(([x])=>x.endTime=Date.now()+31536000000);
      originalShowcaseRender();
      oneTimeEnds.forEach(([x,end])=>x.endTime=end);
      state.curses.filter(x=>x.oneTime===true||x.oneTime==='true').forEach(x=>{
        const cards=[...document.querySelectorAll('#cards .card')];
        const card=cards.find(c=>c.querySelector('h3')?.textContent.includes(x.name||'Без имени'));
        if(card){ card.classList.remove('expired'); const badge=card.querySelector('.badge'); if(badge){badge.className='badge active'; badge.textContent='РАЗОВОЕ';} const timer=card.querySelector('.timer'); if(timer) timer.textContent='Разовое проклятие'; }
      });
    };
    render();
</script>
</body>
</html>
